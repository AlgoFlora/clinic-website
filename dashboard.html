<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Devaki Clinic</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/lang-switch.css">
  <link rel="stylesheet" href="css/dashboard-extra.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="logo"><div class="logo-icon" style="width:36px;height:36px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20"/></svg></div><div class="logo-text"><span class="logo-name" style="font-size:0.95rem;">Devaki Clinic</span></div></a>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <a href="#overview" class="sidebar-link active" data-view="overview"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> <span data-i18n="dash_overview">Dashboard</span></a>
          <a href="#appointments" class="sidebar-link" data-view="appointments"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> <span data-i18n="dash_appointments">Appointments</span><span class="badge badge-primary" id="navApptBadge" hidden>0</span></a>
          <a href="#patients" class="sidebar-link" data-view="patients"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span data-i18n="dash_patients">Patients</span></a>
          <a href="#records" class="sidebar-link" data-view="records"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> <span data-i18n="dash_clinical">Clinical Records</span></a>
          <a href="#prescriptions" class="sidebar-link" data-view="prescriptions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7z"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/></svg> <span data-i18n="dash_prescriptions">Prescriptions</span></a>
          <a href="#followups" class="sidebar-link" data-view="followups"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> <span data-i18n="dash_followups">Follow-ups</span><span class="badge badge-warning" id="navFuBadge" hidden>0</span></a>
          <a href="#reports" class="sidebar-link" data-view="reports"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> <span data-i18n="dash_reports">Reports</span></a>
          <a href="#settings" class="sidebar-link" data-view="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> <span data-i18n="dash_settings">Settings</span></a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label" data-i18n="dash_language">Language</div>
          <div class="lang-switch side"><button class="lang-btn active" data-lang="en">English</button><button class="lang-btn" data-lang="mr">मराठी</button></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> <span data-i18n="dash_website">View Website</span></a>
        <a href="#" class="sidebar-link btn-logout"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> <span data-i18n="dash_logout">Logout</span></a>
      </div>
    </aside>

    <main class="dash-main">
      <div class="dash-topbar">
        <div class="dash-topbar-left"><h1 id="viewTitle" data-i18n="dash_overview">Dashboard</h1><div class="breadcrumb"><span data-i18n="dash_welcome">Welcome back,</span> <span id="docName">Dr. Dnyaneshwar Giri</span></div></div>
        <div class="dash-topbar-right">
          <span class="live-pill" id="livePill"><i></i><span id="liveText">Live</span></span>
          <span class="dash-date" id="dash-date"></span>
          <div class="dash-user"><div class="dash-user-info"><span class="dash-user-name" id="docName2">Dr. Dnyaneshwar Giri</span><span class="dash-user-role" data-i18n="doc_role_short">Physician</span></div><div class="avatar">DG</div></div>
        </div>
      </div>
      <div class="dash-content" id="viewRoot"><p class="empty">Loading…</p></div>
    </main>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>
  <div id="modalRoot"></div>

  <script src="js/translations.js"></script>
  <script src="js/translations-extra.js"></script>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/dashboard-mr.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/dashboard-rx.js"></script>
</body>
</html>
