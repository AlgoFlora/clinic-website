<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Portal — Devaki Clinic</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/lang-switch.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="10" opacity="0.3"/></svg></div>
        <div class="logo-text"><span class="logo-name">Devaki Clinic</span><span class="logo-subtitle">Doctor Portal</span></div>
      </div>
      <div class="lang-switch" style="margin:0 auto 14px;"><button class="lang-btn active" data-lang="en">English</button><button class="lang-btn" data-lang="mr">मराठी</button></div>
      <h2 data-i18n="login_title">Doctor Portal</h2>
      <p class="login-subtitle" data-i18n="login_subtitle">Sign in to access your dashboard</p>
      <form class="login-form">
        <div class="form-group">
          <label class="form-label" data-i18n="login_email">Email Address</label>
          <input type="email" class="form-input" id="login-email" placeholder="doctor@devaki.in" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="login_password">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" data-i18n="login_btn">Sign In</button>
      </form>
      <div class="login-footer">
        <p data-i18n="login_note">Access restricted to authorized medical staff only.</p>
        <p style="margin-top:8px;font-size:0.75rem;color:var(--neutral-400);">Default login: doctor@devaki.in / doctor123 — change it in Settings</p>
        <a href="index.html" style="display:inline-block;margin-top:16px;color:var(--primary);font-weight:600;">← Back to Website</a>
      </div>
    </div>
  </div>
  <script src="js/translations.js"></script>
  <script src="js/translations-extra.js"></script>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
